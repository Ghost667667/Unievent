name: unievent
description: "UniEvent — Every campus event, one tap away. Discover • Connect • Celebrate"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  google_sign_in: ^6.2.1

  # State management & navigation
  provider: ^6.1.2
  go_router: ^14.6.0

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10
  fl_chart: ^0.69.0
  shimmer: ^3.0.0

  # QR
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2

  # Integrations
  google_maps_flutter: ^2.9.0
  url_launcher: ^6.3.1
  http: ^1.2.2

  # Device / storage
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.1.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4

  # Reporting
  pdf: ^3.11.1
  printing: ^5.13.3

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.18.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_cloud_firestore: ^3.0.3
  firebase_auth_mocks: ^0.14.1
  mockito: ^5.4.4
  build_runner: ^2.4.13
  network_image_mock: ^2.1.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# Launcher icon — regenerate with:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 23
  remove_alpha_ios: true
